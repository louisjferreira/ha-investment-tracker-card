name: Validate

on:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Build backend-enabled card
        run: python3 scripts/build_release.py
      - name: Check generated card JavaScript syntax
        run: node --check dist/ha-investment-tracker-card.js
