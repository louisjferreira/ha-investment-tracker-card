name: Validate

on:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check card JavaScript syntax
        run: node --check investment-tracker-card.js
